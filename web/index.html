<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>a-souvenir-of-sudokus</title>
  <!-- engine artifacts: built by emcmake (see README), copied by trunk -->
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.js" data-target-path="souvenir" />
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.wasm" data-target-path="souvenir" />
  <link data-trunk rel="copy-dir" href="assets" />
  <script type="module">
    import createSouvenir from "./souvenir/souvenir.js";
    const mod = await createSouvenir();
    window.souvenir_cmd = mod.cwrap("souvenir_cmd", "string", ["string"]);
  </script>
  <style>
    :root { --paper: #f7f2e8; --red: #b5271d; --ink: #1a1a1a; }
    body { background: var(--paper); color: var(--ink); font-family: Georgia, serif;
           display: flex; flex-direction: column; align-items: center; margin: 1.2rem; }
    h1 { font-size: 1.1rem; font-weight: normal; letter-spacing: 0.12em; margin: 0 0 0.8rem; }
    .grid { display: grid; grid-template-columns: repeat(9, 3.2rem); border: 2px solid var(--red); }
    .cell { width: 3.2rem; height: 3.2rem; border: 1px solid var(--red);
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; box-sizing: border-box; }
    /* the tic-tac-toe cross, black over the red minor lines — as in the originals */
    .cross-r { border-right: 2px solid var(--ink); }
    .cross-b { border-bottom: 2px solid var(--ink); }
    .cell img.value { width: 78%; height: 78%; }
    .cell.selected { background: #e8dfc8; }
    .cell.same { background: #efe6cf; }
    .marks { position: absolute; inset: 2px; display: flex; flex-wrap: wrap;
             align-content: flex-start; gap: 1px; }
    .marks img { width: 0.85rem; height: 0.85rem; opacity: 0.75; }
    .bar { margin-top: 0.9rem; display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    button { font-family: inherit; background: none; border: 1px solid var(--ink);
             padding: 0.25rem 0.7rem; cursor: pointer; }
    button.on { background: var(--ink); color: var(--paper); }
    .msg { margin-top: 0.7rem; min-height: 1.3rem; font-style: italic; }
    .status { margin-top: 0.2rem; font-size: 0.85rem; opacity: 0.75; }
    .solved { color: var(--red); font-weight: bold; }
  </style>
</head>
<body></body>
</html>
