<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>a-souvenir-of-sudokus</title>
  <!-- PWA: installable ("Add to Home Screen") and playable offline -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f7f2e8" />
  <link rel="apple-touch-icon" href="pwa/icon-192.png" />
  <!-- engine artifacts: built by emcmake (see README), copied by trunk -->
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.js" data-target-path="souvenir" />
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.wasm" data-target-path="souvenir" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link data-trunk rel="copy-dir" href="pwa" />
  <script type="module">
    import createSouvenir from "./souvenir/souvenir.js";
    const mod = await createSouvenir();
    window.souvenir_cmd = mod.cwrap("souvenir_cmd", "string", ["string"]);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
  <style>
    :root { --paper: #f7f2e8; --red: #b5271d; --ink: #1a1a1a; --cell: 3.2rem; }
    body { background: var(--paper); color: var(--ink); font-family: Georgia, serif;
           display: flex; flex-direction: column; align-items: center; margin: 1.2rem; }
    h1 { font-size: 1.1rem; font-weight: normal; letter-spacing: 0.12em; margin: 0 0 0.8rem; }
    /* phone fit: cells shrink with the viewport so the 9x9 always fits portrait */
    @media (max-width: 520px) {
      :root { --cell: calc((100vw - 1.4rem) / 9); }
      body { margin: 0.5rem; }
      h1 { font-size: 0.9rem; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    }
    .grid { display: grid; grid-template-columns: repeat(9, var(--cell)); border: 2px solid var(--red); }
    .cell { width: var(--cell); height: var(--cell); border: 1px solid var(--red);
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; box-sizing: border-box; }
    /* touch hygiene: taps act immediately (no dbl-tap zoom), always hit the
       cell (not the glyph <img>), and never pop the save-image sheet */
    .grid, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .grid { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .glyph { pointer-events: none; }
    /* composed reveal: splash covers the page until every asset is ready,
       then the finished board fades in as one piece */
    .app { display: flex; flex-direction: column; align-items: center; opacity: 0; }
    .app.ready { opacity: 1; transition: opacity 0.6s ease; }
    .splash { position: fixed; inset: 0; z-index: 10; background: var(--paper);
              display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 0.4rem; transition: opacity 0.5s ease; }
    .splash.hidden { opacity: 0; pointer-events: none; }
    .splash .dots { color: var(--red); letter-spacing: 0.45em;
                    animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    img.preload { position: absolute; width: 1px; height: 1px; opacity: 0;
                  pointer-events: none; }
    /* the tic-tac-toe cross, black over the red minor lines — as in the originals */
    .cross-r { border-right: 2px solid var(--ink); }
    .cross-b { border-bottom: 2px solid var(--ink); }
    .glyph { background-repeat: no-repeat; }
    .cell div.value { width: 78%; height: 78%; }
    /* translucent, so a pack's paper background shows through the board */
    .cell.selected { background: rgba(190, 160, 70, 0.30); }
    .cell.same { background: rgba(190, 160, 70, 0.16); }
    .marks { position: absolute; inset: 2px; display: flex; flex-wrap: wrap;
             align-content: flex-start; gap: 1px; }
    .cell div.ghost { position: absolute; width: 78%; height: 78%; left: 11%; top: 11%;
                      transition: opacity 0.6s linear; pointer-events: none;
                      filter: blur(0.4px); }
    .grid.flipping { animation: phantomflip 0.7s ease; }
    @keyframes phantomflip {
      0%   { opacity: 1; }
      40%  { opacity: 0.12; filter: blur(3px); }
      100% { opacity: 1; filter: none; }
    }
    .marks div.glyph { width: calc(var(--cell) * 0.27); height: calc(var(--cell) * 0.27); opacity: 0.75; }
    .bar { margin-top: 0.55rem; display: flex; gap: 0.45rem; flex-wrap: wrap;
           justify-content: center; align-items: center; max-width: calc(var(--cell) * 9 + 4px); }
    .bar.palette { margin-top: 1rem; gap: 0.3rem; }
    /* digit buttons keep >=43px tap targets; on narrow screens they wrap 5+5
       rather than shrinking below a comfortable touch size */
    button { font-family: inherit; background: none; border: 1px solid var(--ink);
             padding: 0.25rem 0.7rem; cursor: pointer; }
    button.on { background: var(--ink); color: var(--paper); }
    button.digit { width: 2.7rem; height: 2.7rem; padding: 0.2rem;
                   border: 1px solid var(--red); border-radius: 3px; }
    button.digit div.glyph { width: 100%; height: 100%; }
    button.digit.done { opacity: 0.25; }
    button.digit.erase { color: var(--red); font-size: 1.1rem; }
    .seg { display: inline-flex; }
    .seg button { border-right-width: 0; }
    .seg button:last-child { border-right-width: 1px; }
    .bar.setup button { font-size: 0.85rem; padding: 0.2rem 0.6rem; opacity: 0.85; }
    .msg { margin-top: 0.7rem; min-height: 1.3rem; font-style: italic; }
    .status { margin-top: 0.2rem; font-size: 0.85rem; opacity: 0.75; }
    .solved { color: var(--red); font-weight: bold; }
  </style>
</head>
<body></body>
</html>
