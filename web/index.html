<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>a-souvenir-of-sudokus</title>
  <script>
    // A URL nobody meant to type is a dead end. The game lives at the site
    // root and reads exactly two knobs from the query string — any other path
    // or parameter means someone is trying the door handles, and gets the
    // valvula page instead of the grid. GitHub Pages already answers unknown
    // paths with 404.html; this is the same answer on any host that falls back
    // to index.html instead (trunk's dev server does, and so does the service
    // worker offline). It runs before the engine module loads, so no board
    // flashes first.
    (function () {
      var p = location.pathname, q = location.search.replace(/^\?/, "");
      // the packaged app serves itself from its own protocol (tauri://, or
      // http://tauri.localhost on Windows) — leave the webview alone
      var web = (location.protocol === "http:" || location.protocol === "https:") &&
                location.hostname !== "tauri.localhost";
      var strayPath = web && !(p.endsWith("/") || p.endsWith("/index.html"));
      var known = ["pack", "dev"];
      var strayQuery = !!q && q.split("&").some(function (kv) {
        return kv && known.indexOf(kv.split("=")[0]) < 0;
      });
      // never bounce the valvula page at itself, however it came to be served
      if ((strayPath || strayQuery) && !p.endsWith("404.html")) {
        var seg = p.split("/")[1];
        // project pages live under /<repo>/; everywhere else the root is /
        var root = location.hostname.endsWith("github.io") && seg ? "/" + seg + "/" : "/";
        location.replace(root + "404.html?tried=" + encodeURIComponent(p + location.search));
      }
    })();
  </script>
  <!-- PWA: installable ("Add to Home Screen") and playable offline -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f7f2e8" />
  <link rel="apple-touch-icon" href="pwa/icon-192.png" />
  <!-- engine artifacts: built by emcmake (see README), copied by trunk -->
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.js" data-target-path="souvenir" />
  <link data-trunk rel="copy-file" href="../engine/build/wasm/souvenir.wasm" data-target-path="souvenir" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="404.html" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link data-trunk rel="copy-dir" href="pwa" />
  <script type="module">
    import createSouvenir from "./souvenir/souvenir.js";
    const mod = await createSouvenir();
    window.souvenir_cmd = mod.cwrap("souvenir_cmd", "string", ["string"]);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
  <style>
    :root { --paper: #f7f2e8; --red: #b5271d; --ink: #1a1a1a;
            /* one palette, named by role: every piece of chrome is ink at low
               strength, so the handwriting stays the darkest thing on the page */
            --ink-soft: rgba(26, 26, 26, 0.74);
            --line: rgba(26, 26, 26, 0.40);
            --line-faint: rgba(26, 26, 26, 0.22);
            --wash: rgba(26, 26, 26, 0.07);
            --gold: rgba(190, 160, 70, 0.30);
            --gold-faint: rgba(190, 160, 70, 0.16);
            /* the phantom's colour: cold ink-blue against the warm paper */
            --phantom: #26406b;
            --good: #3c6b45;  /* the check's green, ink-toned for the paper */
            --hangman: #35603f;  /* the hangman's green: the room he judges in */
            /* fit the board to whichever axis is tighter: the 9x9 plus its
               bars must never need scrolling, on a phone or a short window */
            --cell: min(3.2rem, (100vw - 1.6rem) / 9, (100vh - 15rem) / 9); }
    body { background: var(--paper); color: var(--ink);
           font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
           line-height: 1.5; -webkit-font-smoothing: antialiased;
           display: flex; flex-direction: column; align-items: center; margin: 1.2rem; }
    h1 { font-size: 1.05rem; font-weight: normal; letter-spacing: 0.17em;
         color: var(--ink-soft); margin: 0 0 0.9rem; text-align: center; }
    /* phone fit: cells shrink with the viewport so the 9x9 always fits portrait */
    @media (max-width: 520px) {
      :root { --cell: min((100vw - 1.1rem) / 9, (100vh - 13rem) / 9); }
      body { margin: 0.5rem; }
      h1 { font-size: 0.9rem; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    }
    .grid { display: grid; grid-template-columns: repeat(9, var(--cell));
            border: 3px solid var(--red);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5), 0 2px 14px rgba(26, 26, 26, 0.10);
            transition: border-color 0.5s ease, box-shadow 0.6s ease; }
    .cell { width: var(--cell); height: var(--cell); border: 1.5px solid var(--red);
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; box-sizing: border-box; }
    /* touch hygiene: taps act immediately (no dbl-tap zoom), always hit the
       cell (not the glyph <img>), and never pop the save-image sheet */
    .grid, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .grid { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .glyph { pointer-events: none; }
    /* composed reveal: splash covers the page until every asset is ready,
       then the finished board fades in as one piece */
    .app { display: flex; flex-direction: column; align-items: center; opacity: 0; }
    .app.ready { opacity: 1; transition: opacity 0.6s ease; }
    .splash { position: fixed; inset: 0; z-index: 10; background: var(--paper);
              display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 0.4rem; transition: opacity 0.5s ease; }
    .splash.hidden { opacity: 0; pointer-events: none; }
    /* loading dots: a highlight travels left->right (ooo -> *oo -> o*o -> oo*) */
    .splash .dots span { display: inline-block; margin: 0 0.26em; font-size: 0.7rem;
                         color: var(--red); opacity: 0.22;
                         animation: dotwave 1.05s ease-in-out infinite; }
    .splash .dots span:nth-child(2) { animation-delay: 0.175s; }
    .splash .dots span:nth-child(3) { animation-delay: 0.35s; }
    @keyframes dotwave {
      0%, 55%, 100% { opacity: 0.22; transform: translateY(0); }
      22%           { opacity: 1; transform: translateY(-0.14em); }
    }
    img.preload { position: absolute; width: 1px; height: 1px; opacity: 0;
                  pointer-events: none; }
    /* the rules page: a card in the game's own voice */
    .rules-overlay { position: fixed; inset: 0; z-index: 8; padding: 1rem;
                     background: rgba(26, 26, 26, 0.35);
                     display: flex; align-items: center; justify-content: center; }
    .rules-card { background: var(--paper); border: 1px solid var(--ink);
                  max-width: 36rem; max-height: 85vh; overflow: auto;
                  padding: 1.1rem 1.4rem 1.3rem;
                  box-shadow: 0 6px 30px rgba(26, 26, 26, 0.35); }
    .rules-card h1 { text-align: center; }
    .rules-card h2 { font-size: 0.95rem; font-weight: normal; color: var(--red);
                     letter-spacing: 0.12em; margin: 1rem 0 0.3rem; }
    .rules-card p { line-height: 1.55; margin: 0.2rem 0; }
    .rules-card button { margin-top: 1rem; }
    /* the ledger: a column of finished grids, read like a notebook page */
    p.tally { color: var(--ink-soft); font-style: italic; margin: 0 0 0.6rem; }
    ul.ledger { list-style: none; margin: 0; padding: 0;
                max-height: 46vh; overflow: auto; }
    ul.ledger li { display: grid; grid-template-columns: auto 1fr auto;
                   gap: 0.8rem; align-items: baseline; padding: 0.3rem 0;
                   border-bottom: 1px solid var(--line-faint); }
    ul.ledger li:last-child { border-bottom: none; }
    ul.ledger .when { color: var(--ink-soft); font-size: 0.82rem;
                      font-variant-numeric: tabular-nums; }
    ul.ledger .what { color: var(--ink); }
    ul.ledger .howlong { color: var(--red); font-variant-numeric: tabular-nums; }
    ul.ledger li.openable { cursor: pointer; }
    ul.ledger li.openable:hover { background: var(--wash); }
    ul.ledger li.open .when { color: var(--red); }
    /* the finished grid, re-read: his givens in ink, your digits in red */
    .mini-grid { display: grid; grid-template-columns: repeat(9, 1.5rem);
                 border: 2px solid var(--red); margin: 0.9rem auto 0;
                 width: max-content; background: var(--paper); }
    .mini-cell { width: 1.5rem; height: 1.5rem; border: 1px solid var(--line-faint);
                 box-sizing: border-box; display: flex;
                 align-items: center; justify-content: center; }
    .mini-cell .glyph { width: 78%; height: 78%; }
    .mini-cell.cross-r { border-right: 2px solid var(--ink); }
    .mini-cell.cross-b { border-bottom: 2px solid var(--ink); }
    @media (max-width: 520px) {
      .mini-grid { grid-template-columns: repeat(9, 1.15rem); }
      .mini-cell { width: 1.15rem; height: 1.15rem; }
    }
    .card-actions { display: flex; justify-content: space-between;
                    align-items: center; gap: 1rem; }
    .card-actions button:first-child { color: var(--ink-soft);
                                       border-color: var(--line-faint); }
    /* the button glossary: the term in the game's own red, its sense beside it */
    dl.controls { margin: 0.4rem 0 0; display: grid; grid-template-columns: auto 1fr;
                  gap: 0.45rem 0.9rem; align-items: baseline; }
    dl.controls dt { color: var(--red); white-space: nowrap; font-style: italic; }
    dl.controls dd { margin: 0; line-height: 1.5; }
    @media (max-width: 520px) {
      dl.controls { grid-template-columns: 1fr; gap: 0.15rem; }
      dl.controls dt { margin-top: 0.55rem; }
    }
    /* the tic-tac-toe cross, black over the red minor lines — as in the originals */
    .cross-r { border-right: 3px solid var(--ink); }
    .cross-b { border-bottom: 3px solid var(--ink); }
    .glyph { background-repeat: no-repeat; }
    .cell div.value { width: 78%; height: 78%; }
    /* translucent, so a pack's paper background shows through the board */
    .cell.selected { background: var(--gold); }
    .cell.same { background: var(--gold-faint); }
    .marks { position: absolute; inset: 2px; display: flex; flex-wrap: wrap;
             align-content: flex-start; gap: 1px; }
    .cell div.ghost { position: absolute; width: 78%; height: 78%; left: 11%; top: 11%;
                      transition: opacity 0.6s linear; pointer-events: none;
                      filter: blur(0.4px); }
    /* phantom mode: his warm red leaves the room and a cold blue takes it —
       the board, its rules and the clock all turn to the phantom's colour */
    .app.phantom .grid { border-color: var(--phantom);
                         box-shadow: 0 0 0 3px rgba(38, 64, 107, 0.10),
                                     0 3px 34px rgba(38, 64, 107, 0.38); }
    .app.phantom .cell { border-color: rgba(38, 64, 107, 0.42); }
    .app.phantom .cross-r { border-right-color: var(--phantom); }
    .app.phantom .cross-b { border-bottom-color: var(--phantom); }
    .app.phantom h1 { color: var(--phantom); letter-spacing: 0.2em; }
    .app.phantom .status { color: var(--phantom); letter-spacing: 0.05em; font-weight: bold; }
    .app.phantom .msg { color: var(--phantom); }
    .app.phantom button.digit { border-color: rgba(38, 64, 107, 0.45); }
    .app.phantom .cell.selected { background: rgba(38, 64, 107, 0.16); }
    .app.phantom .cell.same { background: rgba(38, 64, 107, 0.08); }
    .grid.flipping { animation: phantomflip 0.7s ease; }
    @keyframes phantomflip {
      0%   { opacity: 1; }
      40%  { opacity: 0.12; filter: blur(3px); }
      100% { opacity: 1; filter: none; }
    }
    .marks div.glyph { width: calc(var(--cell) * 0.27); height: calc(var(--cell) * 0.27); opacity: 0.75; }
    .bar { margin-top: 0.55rem; display: flex; gap: 0.45rem; flex-wrap: wrap;
           justify-content: center; align-items: center; max-width: calc(var(--cell) * 9 + 4px); }
    .bar.palette { margin-top: 0.9rem; gap: 0.32rem; }
    .bar.setup { margin-top: 0.9rem; }
    /* digit buttons keep >=43px tap targets; on narrow screens they wrap 5+5
       rather than shrinking below a comfortable touch size */
    button { font-family: inherit; font-size: 0.95rem; color: var(--ink);
             background: none; border: 1px solid var(--line); border-radius: 2px;
             padding: 0.28rem 0.75rem; cursor: pointer;
             transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease; }
    button:hover:not(:disabled) { background: var(--wash); border-color: var(--ink-soft); }
    button:active:not(:disabled) { transform: translateY(0.5px); }
    button:disabled { opacity: 0.3; cursor: default; }
    /* the game is fully playable from the keyboard — give that a visible ring */
    button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    button.digit { width: 2.7rem; height: 2.7rem; padding: 0.2rem;
                   border: 1px solid var(--red); border-radius: 3px; }
    button.digit div.glyph { width: 100%; height: 100%; }
    button.digit.done { opacity: 0.25; }
    /* labels for icon-only buttons: above the button, never under the hand.
       A real element, not a ::after — predictable, and it works on touch too */
    .tipped { position: relative; }
    .tipped .tip {
      position: absolute; bottom: calc(100% + 0.4rem); left: 50%;
      transform: translateX(-50%) translateY(0.15rem);
      background: var(--ink); color: var(--paper);
      font-size: 0.72rem; letter-spacing: 0.05em; line-height: 1.5;
      padding: 0.1rem 0.5rem; border-radius: 2px; white-space: nowrap;
      opacity: 0; pointer-events: none; z-index: 20;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .tipped:hover .tip, .tipped:focus-visible .tip, .tipped:active .tip {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    button.digit.erase { color: var(--red); display: flex; align-items: center;
                         justify-content: center; }
    button.digit.erase svg { width: 68%; height: 68%; }
    .seg { display: inline-flex; }
    .seg button { border-right-width: 0; }
    .seg button:last-child { border-right-width: 1px; }
    .bar.setup button { font-size: 0.8rem; padding: 0.18rem 0.55rem;
                        color: var(--ink-soft); border-color: var(--line-faint); }
    .bar.setup button:hover:not(:disabled) { color: var(--ink); }
    .bar.setup button.on { color: var(--paper); }
    .msg { margin-top: 0.75rem; min-height: 1.3rem; font-style: italic;
           color: var(--ink-soft); text-align: center; transition: color 0.4s ease; }
    .status { margin-top: 0.25rem; font-size: 0.82rem; color: var(--ink-soft);
              letter-spacing: 0.02em; }
    /* the win: the board settles and blooms in his red, and the line rises
       in under it — the one flourish the game allows itself */
    .grid.won { border-color: var(--red);
                box-shadow: 0 0 0 5px rgba(181, 39, 29, 0.10),
                            0 4px 38px rgba(181, 39, 29, 0.30);
                animation: settle 1.2s ease both; }
    /* won inside the haunting: the bloom keeps the phantom's colour — you
       beat it in its own room, so the room stays cold */
    .app.phantom .grid.won { border-color: var(--phantom);
                             box-shadow: 0 0 0 5px rgba(38, 64, 107, 0.12),
                                         0 4px 38px rgba(38, 64, 107, 0.42); }
    @keyframes settle {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.014); }
      100% { transform: scale(1); }
    }
    /* the loss: the board drains and recedes — the puzzle stops being yours.
       The mirror of the win: one rises and blooms, the other dims and shrinks */
    .grid.lost { border-color: rgba(38, 64, 107, 0.55);
                 box-shadow: none;
                 filter: grayscale(0.55) opacity(0.62);
                 animation: recede 1.4s ease both; }
    .app.phantom .grid.lost { border-color: rgba(38, 64, 107, 0.55); }
    .grid.lost .cell.selected, .grid.lost .cell.same { background: none; }
    @keyframes recede {
      0%   { transform: scale(1); filter: grayscale(0) opacity(1); }
      100% { transform: scale(0.975); filter: grayscale(0.55) opacity(0.62); }
    }
    /* hangman mode has its own room, as phantom does: a sober green takes
       his red, and the gallows stays in the same grey the chrome uses */
    .app.hangman-mode .grid { border-color: var(--hangman);
                              box-shadow: 0 0 0 3px rgba(53, 96, 63, 0.10),
                                          0 3px 30px rgba(53, 96, 63, 0.30); }
    .app.hangman-mode .cell { border-color: rgba(53, 96, 63, 0.42); }
    .app.hangman-mode .cross-r { border-right-color: var(--hangman); }
    .app.hangman-mode .cross-b { border-bottom-color: var(--hangman); }
    .app.hangman-mode h1 { color: var(--hangman); letter-spacing: 0.2em; }
    .app.hangman-mode .status { color: var(--hangman); letter-spacing: 0.05em; font-weight: bold; }
    .app.hangman-mode .msg { color: var(--hangman); }
    .app.hangman-mode button.digit { border-color: rgba(53, 96, 63, 0.45); }
    .app.hangman-mode .cell.selected { background: rgba(53, 96, 63, 0.16); }
    .app.hangman-mode .cell.same { background: rgba(53, 96, 63, 0.08); }
    .app.hangman-mode .grid.won { border-color: var(--hangman);
                                  box-shadow: 0 0 0 5px rgba(53, 96, 63, 0.12),
                                              0 4px 38px rgba(53, 96, 63, 0.40); }
    /* hangman mode: he is drawn beside the board, in the same pen */
    .board-row { display: flex; align-items: flex-start; justify-content: center;
                 gap: 1rem; }
    svg.hangman { width: calc(var(--cell) * 2.6); flex: none; margin-top: 0.2rem; }
    svg.hangman .gallows { stroke: var(--ink-soft); stroke-width: 2.5; }
    /* the room judges in green, but the man is drawn in his red — the
       threat keeps the pen */
    svg.hangman .figure { stroke: var(--red); stroke-width: 3; }
    svg.hangman .figure > * { animation: ink-in 0.45s ease both; }
    @keyframes ink-in { 0% { opacity: 0; transform: translateY(-2px); }
                        100% { opacity: 1; transform: translateY(0); } }
    button.ask-hangman { border-color: var(--red); color: var(--red); }
    button.hidden { display: none; }
    @media (max-width: 520px) {
      /* beside the board, the hangman stole the width the grid needs; on a
         phone he stands above it instead, and the board keeps the room */
      .board-row { flex-direction: column-reverse; align-items: center; gap: 0.3rem; }
      svg.hangman { width: auto; height: 17vh; max-height: 150px; margin: 0; }
      /* ...and the cells give back the height he occupies */
      .app.hangman-mode { --cell: min((100vw - 1.1rem) / 9, (100vh - 13rem - 18vh) / 9); }
    }
    /* the reading beat: quiet, then the verdict lands */
    .verdict-reading { color: var(--ink-soft); font-style: italic; opacity: 0.85;
                       animation: breathe 1.3s ease-in-out infinite; }
    /* shallower than it was: the inspection below has to stay legible through it */
    @keyframes breathe { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }
    /* the same inspection as the valvula page, at the pace of one check (1.3s):
       he looks it over, taps it, and the gear turns while the gauge reads.
       No shrug here — the verdict replaces the whole line. */
    .inspect { display: inline-flex; gap: 0.18em; margin-right: 0.4em;
               vertical-align: -0.06em; font-style: normal; }
    /* longhands only, deliberately: an `animation` shorthand carrying no
       keyframes name leaves the duration at 0s wherever the declaration is
       not honoured, and a 0s animation is indistinguishable from a frozen one */
    .inspect span { display: inline-block; animation-duration: 1.3s;
                    animation-timing-function: ease-in-out;
                    animation-iteration-count: infinite; }
    .inspect .glass  { animation-name: sweep; }
    .inspect .wrench { animation-name: tap; animation-delay: 0.15s; }
    .inspect .gear   { animation-name: turn; animation-duration: 1.95s;
                       animation-timing-function: linear; }
    @keyframes sweep { 0%, 100% { transform: translateX(-0.12em) rotate(-10deg); }
                       50%      { transform: translateX(0.12em) rotate(10deg); } }
    @keyframes tap   { 0%, 100% { transform: rotate(-14deg); }
                       50%      { transform: rotate(12deg) translateY(0.05em); } }
    @keyframes turn  { to { transform: rotate(360deg); } }
    /* Motion sensitivity is about travel and rotation, not light: with reduce
       asked for, nobody sweeps or turns, but the three still take their turn
       brightening so the line reads as working rather than stuck. The breathing
       of the words is opacity too, so it stays. */
    @media (prefers-reduced-motion: reduce) {
      .inspect .glass, .inspect .wrench, .inspect .gear {
        animation-name: look; animation-duration: 1.3s;
        animation-timing-function: ease-in-out; animation-iteration-count: infinite;
      }
      .inspect .wrench { animation-delay: 0.22s; }
      .inspect .gear   { animation-delay: 0.44s; }
    }
    @keyframes look { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    /* check results read as a verdict: a mark, then the words */
    .verdict-good { color: var(--good); font-style: normal; }
    .verdict-bad { color: var(--red); font-style: normal; }
    .lost-msg { color: var(--phantom); font-weight: bold; font-style: normal;
                letter-spacing: 0.03em; animation: rise-in 1s ease both; }
    @keyframes rise-in {
      0%   { opacity: 0; transform: translateY(0.4rem); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .solved { color: var(--red); font-weight: bold; font-style: normal;
              letter-spacing: 0.03em; font-size: 1.05rem;
              animation: rise-in 0.8s ease both; }
    /* some people get motion sick; no information lives in the game's motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important;
                               transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <noscript>
    <div style="max-width:32rem;margin:3rem auto;text-align:center;line-height:1.6">
      <h1>a-souvenir-of-sudokus</h1>
      <p>This game runs in your browser and needs JavaScript enabled.</p>
      <p>Prefer an app? Downloads for Windows, Mac and Linux are on the
