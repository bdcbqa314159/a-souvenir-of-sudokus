name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# minimal permissions: this workflow can publish Pages and nothing else
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Engine -> wasm
        run: |
          emcmake cmake -S engine -B engine/build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build/wasm -j
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: 'v0.21.14'
      - name: Web build (under the repo subpath)
        run: cd web && trunk build --release --public-url /a-souvenir-of-sudokus/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
