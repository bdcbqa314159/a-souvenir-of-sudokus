name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bindings
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DSOUVENIR_BUILD_PYTHON=ON -DSOUVENIR_BUILD_TESTS=OFF
          cmake --build build -j
      - run: python3 test_sudoku.py
      - run: python3 test_bindings.py

  format-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install clang-format==18.1.8
      - name: clang-format check
        run: >
          clang-format --dry-run -Werror
          $(git ls-files 'engine/include/**/*.hpp' 'engine/src/*.cpp' 'engine/tests/*.cpp')
